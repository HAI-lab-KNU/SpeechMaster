conditionalEvents:
- condition: scene.slots.status == "FINAL"
  transitionToScene: LearningEnquiry
onEnter:
  webhookHandler: setActivityEnquiryStartTime
slots:
- commitBehavior:
    writeSessionParam: User_Activity
  name: User_Activity
  promptSettings:
    initialPrompt:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Hi! What are you doing now?
    noInputPrompt1:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Hi! What are you doing now?
      webhookHandler: ErrorHandling
    noInputPrompt2:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Hi! What are you doing now?
      webhookHandler: ErrorHandling
    noMatchPrompt1:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Sorry, I don't understand! Please say again
      webhookHandler: ErrorHandling
    noMatchPrompt2:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Sorry, I don't understand! Please say again
      webhookHandler: ErrorHandling
  required: true
  type:
    name: User_Activity
