conditionalEvents:
- condition: scene.slots.status == "FINAL"
  handler:
    webhookHandler: checkAnswer
  transitionToScene: SpeechPractice
onEnter:
  webhookHandler: giveSentence
slots:
- commitBehavior:
    writeSessionParam: answer
  name: answer
  promptSettings:
    noInputPrompt1:
      webhookHandler: repeatSentence
    noInputPrompt2:
      webhookHandler: repeatSentence
    noMatchPrompt1:
      webhookHandler: repeatSentence
    noMatchPrompt2:
      webhookHandler: repeatSentence
  required: true
  type:
    name: SpeechAnswer
