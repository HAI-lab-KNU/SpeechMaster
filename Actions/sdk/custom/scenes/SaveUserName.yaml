conditionalEvents:
- condition: scene.slots.status == "FINAL"
  handler:
    webhookHandler: saveUID
  transitionToScene: actions.scene.END_CONVERSATION
slots:
- commitBehavior:
    writeSessionParam: uid
  name: uid
  promptSettings:
    initialPrompt:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Please say your UID!
    noInputFinalPrompt:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Bye. Try again.
    noInputPrompt1:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Please say our UID!
    noInputPrompt2:
      staticPrompt:
        candidates:
        - promptResponse:
            firstSimple:
              variants:
              - speech: Please say our UID!
  required: true
  type:
    name: UID
